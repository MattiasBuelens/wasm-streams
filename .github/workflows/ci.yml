name: CI
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, reopened, synchronize]
jobs:
  test:
    name: >
      Test
      on ${{ matrix.platform.os }}
      with ${{ matrix.rust.toolchain }}
      ${{ (matrix.rust.rust-flags && format(' and {0}', matrix.rust.rust-flags)) }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: ubuntu-latest
            rust-target: x86_64-unknown-linux-gnu
          - os: macos-latest
            rust-target: aarch64-apple-darwin
        rust:
          - toolchain: stable
          - toolchain: nightly
          # Test with panic=unwind
          - toolchain: nightly
            rust-flags: "-Cpanic=unwind"
            unstable-flags: "-Zbuild-std"
          # Minimum supported Rust version (see Cargo.toml)
          - toolchain: 1.88.0
    env:
      WASM_PACK_VERSION: 0.15.1
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ matrix.rust.toolchain }}
          target: wasm32-unknown-unknown
          components: rust-src
          rustflags: ${{ matrix.rust.rust-flags }}

      # Downloads from GitHub releases regularly fail with HTTP 504 on macOS runners,
      # so cache the tools that we download from there. Refresh the caches monthly
      # to pick up new Node releases.
      - name: Get cache date
        id: cache-date
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Cache Node 26
        uses: actions/cache@v6
        with:
          path: ${{ runner.tool_cache }}/node/26.*
          key: node-26-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-date.outputs.month }}

      - name: Install Node 26
        uses: actions/setup-node@v6
        with:
          node-version: 26

      - name: Run cargo check
        run: cargo check --target=wasm32-unknown-unknown ${{ matrix.rust.unstable-flags }}

      - name: Run cargo test
        run: cargo test --target=${{ matrix.platform.rust-target }}

      # Cache wasm-pack, together with the wasm-bindgen CLI that it downloads
      # for the wasm-bindgen version in Cargo.lock.
      - name: Cache wasm-pack
        uses: actions/cache@v6
        with:
          path: |
            ~/.wasm-pack-bin
            ~/.cache/.wasm-pack/wasm-bindgen*
            ~/Library/Caches/.wasm-pack/wasm-bindgen*
          key: wasm-pack-${{ env.WASM_PACK_VERSION }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: wasm-pack-${{ env.WASM_PACK_VERSION }}-${{ runner.os }}-${{ runner.arch }}-

      - name: Check for cached wasm-pack
        id: cached-wasm-pack
        run: |
          echo "$HOME/.wasm-pack-bin" >> "$GITHUB_PATH"
          if [[ -x "$HOME/.wasm-pack-bin/wasm-pack" ]]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      # The official installer script always installs the x86_64 build on Apple Silicon,
      # which then runs safaridriver under Rosetta and makes it take a very long time to start.
      - name: Install wasm-pack
        if: steps.cached-wasm-pack.outputs.found != 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@${{ env.WASM_PACK_VERSION }}

      - name: Copy wasm-pack to cache
        if: steps.cached-wasm-pack.outputs.found != 'true'
        run: |
          mkdir -p "$HOME/.wasm-pack-bin"
          cp "$(command -v wasm-pack)" "$HOME/.wasm-pack-bin/"

      - name: Test on Node
        run: wasm-pack test --node -- ${{ matrix.rust.unstable-flags }}

      - name: Enable SafariDriver
        if: ${{ startsWith(matrix.platform.os, 'macos-') }}
        run: sudo safaridriver --enable

      - name: Test on Safari
        if: ${{ startsWith(matrix.platform.os, 'macos-') }}
        run: wasm-pack test --headless --safari -- ${{ matrix.rust.unstable-flags }}
        timeout-minutes: 10
        env:
          WASM_BINDGEN_USE_BROWSER: "1"

      - name: Test on Chrome
        run: wasm-pack test --headless --chrome -- ${{ matrix.rust.unstable-flags }}
        env:
          WASM_BINDGEN_USE_BROWSER: "1"

      - name: Test on Firefox
        run: wasm-pack test --headless --firefox -- ${{ matrix.rust.unstable-flags }}
        env:
          WASM_BINDGEN_USE_BROWSER: "1"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Install stable Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Run cargo fmt
        run: cargo fmt --all -- --check

      - name: Run cargo clippy
        run: cargo clippy --target=wasm32-unknown-unknown
